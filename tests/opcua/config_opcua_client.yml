filters:
  - name: OPCUAclientPush
    type: OPCUAclient
    settings:
      base:
        server_url: opc.tcp://eio-1462:53530/OPCUA/SimulationServer
        sampling_interval: 0.05
        reverse_connection: false
    push_items:
      - src_queue_index: 0
        item_index: 1
        ua_node_id: ns=3;i=1001
    # - src_queue_index: 0
    #   item_index: 1
    #   ua_node_id: ns=1;s=1002
    pull_items:
      []
    # - sink_queue_index: 0
    #   item_index: 1
    #   ua_node_id: ns=3;i=1001
    # - sink_queue_index: 1
    #   item_index: 0
    #   ua_node_id: ns=1;s=1002

  - name: OPCUAclientPull
    type: OPCUAclient
    settings:
      base:
        endPointUrl: opc.tcp://localhost:4840
        sampling_interval: 0.05
        reverse_connection: false
    push_items:
      - src_queue_index: 0
        item_index: 0
        ua_node_id: ns=1;i=1001
      - src_queue_index: 0
        item_index: 1
        ua_node_id: ns=1;s=1002
    src_items:
      # - sink_queue_index: 0
      #   item_index: 0
      #   ua_node_id: ns=1;i=1001
      # - sink_queue_index: 1
      #   item_index: 0
      #   ua_node_id: ns=1;s=1002